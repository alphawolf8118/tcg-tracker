{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
</head>
<body class="bg-base-100 font-sans">
    <nav class="navbar bg-primary text-primary-content">
        <div class="container mx-auto flex justify-between">
            <a href="/" class="text-xl font-bold">TCG Tracker</a>
            <div>
                {% if user.is_authenticated %}
                    <span>Welcome, {{ user.username }}</span>
                    <a href="{% url 'accounts:logout' %}" class="ml-4 btn btn-ghost">Logout</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-ghost">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
